<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Métodos Numéricos – Raíces de Ecuaciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--panel:#f8f9fd;--tx:#182033;--mu:#68738a;--ac:#6257e8;--ac2:#eeecff;--bd:#e4e8f1;--ok:#087f5b;--er:#c0394b;--warn:#d97706;color-scheme:light}
:root[data-theme=dark]{--bg:#0b1020;--card:#141b2d;--panel:#101729;--tx:#edf1ff;--mu:#a2adc4;--ac:#9a91ff;--ac2:#29264d;--bd:#28334b;--ok:#56d6a5;--er:#ff7b8c;--warn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,sans-serif}
main{max-width:1300px;margin:0 auto;padding:26px 22px 50px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:1.6rem}.top p{margin:0;color:var(--mu);font-size:.88rem}
button,input,select{font:inherit}
.theme,.btn-sec{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
nav{position:sticky;top:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:0;color:var(--mu);padding:9px;border-radius:10px;cursor:pointer}
nav button span{width:26px;height:26px;display:grid;place-items:center;font:700 .7rem monospace;background:var(--panel);border:1px solid var(--bd);border-radius:8px}
nav button.on{background:var(--ac2);color:var(--tx);font-weight:700}nav button.on span{background:var(--ac);color:#fff}
.head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}.num{background:var(--ac);color:#fff;border-radius:9px;padding:6px 10px;font:800 .8rem monospace}
.head h2{margin:0}.info{color:var(--mu);margin:3px 0 0;font-size:.9rem}
h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:15px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}.wide{grid-column:1/-1}
label{display:block;font-size:.76rem;color:var(--mu);margin-bottom:5px;font-weight:700}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--panel);color:var(--tx);font-family:monospace}
.poly-preview{margin-top:7px;padding:8px 11px;border:1px dashed var(--bd);border-radius:9px;font-family:monospace}.poly-preview span{color:var(--ac);font-weight:700}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}.hint{color:var(--mu);font-size:.77rem}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 22px;border-radius:10px;font-weight:700;cursor:pointer}
.section-title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 10px}.section-title h3{margin:0}
.export-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.75rem;color:var(--mu)}
.res{font-family:monospace;font-size:.85rem;word-break:break-word;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:13px 15px;margin-bottom:13px}
.res.main{border-left:4px solid var(--ac)}.res .k{font:700 .68rem system-ui;text-transform:uppercase;color:var(--mu);margin-top:10px}.res .k:first-child{margin-top:0}.res .v{font-size:1.25rem;font-weight:800}
.err{color:var(--er);font-weight:650}.ok{color:var(--ok);font-weight:700}.warn{color:var(--warn)}
.empty{border:1px dashed var(--bd);border-radius:14px;color:var(--mu);text-align:center;padding:30px}
.sc{overflow:auto;border:1px solid var(--bd);border-radius:10px;max-height:420px}
table{border-collapse:collapse;width:100%;font:.78rem monospace}th,td{padding:8px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}th{position:sticky;top:0;background:var(--panel);color:var(--mu)}
.st{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:11px}
.st li{counter-increment:s;position:relative;padding:13px 15px 13px 52px;background:var(--panel);border:1px solid var(--bd);border-radius:12px}
.st li::before{content:counter(s);position:absolute;left:13px;top:13px;width:27px;height:27px;border-radius:8px;background:var(--ac);color:#fff;font:800 .8rem monospace;display:grid;place-items:center}
.st-title{display:block;font-weight:750}.st-desc{color:var(--mu);font-size:.88rem;margin:3px 0 0}
.formula{display:block;margin-top:8px;padding:8px 12px;font:.86rem monospace;overflow-x:auto;border-left:3px solid var(--ac);background:var(--card);border-radius:8px;color:var(--ac)}
.math-sheet{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:20px;line-height:1.9;overflow-x:auto}
.math-sheet-title{text-align:center;font-weight:800;font-style:italic;text-decoration:underline;font-size:1.1rem;margin-bottom:12px}
.math-init{text-align:center;margin-bottom:16px}
.math-iter-block{margin-bottom:18px;padding-bottom:14px;border-bottom:1px dashed var(--bd)}.math-iter-block:last-child{border:0}
.math-iter-head{font-weight:800;font-style:italic;text-decoration:underline;margin-bottom:8px}.math-line{margin:7px 0}
.math-frac{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15}
.frac .num-f{padding:0 5px 3px;border-bottom:1.5px solid var(--tx)}.frac .den-f{padding:3px 5px 0}
.calc-grid{display:grid;gap:7px;margin-top:7px;font:.81rem monospace}.calc-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--card);border:1px solid var(--bd);border-radius:8px}
.calc-res{padding:7px 10px;background:var(--ac2);border:1px solid var(--ac);border-radius:8px;font-weight:700}
.plot-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:.78rem;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.plot-wrap{border:1px solid var(--bd);border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:330px}
.hide{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}nav{position:static;flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}}
</style></head><body><main>
<header class="top"><div><h1>∑ Métodos Numéricos</h1><p>Laboratorio interactivo de raíces de ecuaciones</p></div><button class="theme" id="theme" type="button">☾ Tema oscuro</button></header>
<div class="app"><nav id="tabs"></nav><section>
<div class="head"><span class="num" id="num"></span><div><h2 id="ttl"></h2><p class="info" id="info"></p></div></div>
<div class="card"><h3>Configuración del cálculo</h3><div class="grid">
<div data-for="2 3 4 5 6 7" class="wide"><label>f(x)</label><input id="f" value="x^3 - 2*x - 5"></div>
<div data-for="1" class="wide"><label>Coeficientes (mayor a menor grado, separados por espacio o coma)</label><input id="poly" value="1 -6 11 -6"><div class="poly-preview" id="polyPrev"></div></div>
<div data-for="2 5 6 7"><label>a (extremo izq.)</label><input id="a" value="2"></div>
<div data-for="2 5 6 7"><label>b (extremo der.)</label><input id="b" value="3"></div>
<div data-for="3 4 5"><label>x0</label><input id="x0" value="2"></div>
<div data-for="4 5"><label>x1</label><input id="x1" value="3"></div>
<div data-for="7"><label>Subdivisiones del barrido</label><input id="n" value="2000"></div>
<div><label>Ejemplos rápidos</label><select id="pre"></select></div>
<div><label>Tolerancia</label><input id="tol" value="1e-30"></div>
<div><label>Máx. iteraciones</label><input id="max" value="100"></div>
<div><label>Dígitos de precisión</label><input id="digits" value="50"></div>
<div><label>Pasos detallados</label><select id="detailLimit"><option value="5">Primeros 5</option><option value="15">Primeros 15</option><option value="9999">Todos</option></select></div>
</div><div class="actions"><button class="btn" id="go">Calcular</button><span class="hint">Funciones: sin, cos, tan, exp, log (ln), sqrt, abs, pi, e · potencia con ^</span></div></div>
<div class="section-title"><h3>Resultados</h3><div class="export-bar"><span id="status">Esperando cálculo</span>
<button class="btn-sec hide" id="btnCopy">Copiar tabla</button><button class="btn-sec hide" id="btnCsv">CSV</button><button class="btn-sec hide" id="btnTxt">TXT</button></div></div>
<div id="out"></div></section></div></main>
<script>
const M=math.create(math.all,{number:'BigNumber',precision:50}),$=id=>document.getElementById(id),D=M.bignumber;
const NAMES=['Ecuaciones algebraicas','Bisección','Newton-Raphson','Secante','Convergencia y precisión','Ecuaciones trascendentales','Múltiples soluciones'];
const INFO=['Halla todas las raíces (reales y complejas) con Durand-Kerner y pule las reales con Newton en alta precisión.',
'Requiere f(a)·f(b)<0. Convergencia lineal garantizada: el error se reduce a la mitad en cada paso.',
'Usa f y su derivada simbólica. Convergencia cuadrática cerca de una raíz simple.',
'Newton sin derivada. Orden de convergencia ≈ 1.618 (razón áurea).',
'Compara Bisección, Newton y Secante con la misma f: errores y orden de convergencia.',
'Método híbrido (Newton protegido por bisección) en [a,b]. Ideal para ecuaciones trascendentales.',
'Barre [a,b], detecta cambios de signo y raíces múltiples (estimando su multiplicidad m) y refina cada una.'];
const PRESETS={
1:[['Cúbica con 3 raíces reales','1 -6 11 -6'],['Raíces complejas (x² + 4)','1 0 4'],['Grado 4 (reales y complejas)','1 -2 3 -2 2'],['Raíz doble en x = 2','1 -3 0 4'],['Raíces de la unidad (x³ - 1)','1 0 0 -1']],
2:[['x³ - 2x - 5 en [2, 3]','x^3 - 2*x - 5',2,3,2,3],['cos(x) - x en [0, 1]','cos(x) - x',0,1,.5,1],['eˣ - 3x en [0, 1]','exp(x) - 3*x',0,1,.5,1]],
3:[['x³ - 2x - 5 desde x₀ = 2','x^3 - 2*x - 5',2,3,2,3],['cos(x) - x desde x₀ = 0.5','cos(x) - x',0,1,.5,1],['Ciclo: x³ - 2x + 2 desde x₀ = 0','x^3 - 2*x + 2',-2,0,0,-1]],
4:[['x³ - 2x - 5 (x₀=2, x₁=3)','x^3 - 2*x - 5',2,3,2,3],['e⁻ˣ - x (x₀=0, x₁=1)','exp(-x) - x',0,1,0,1]],
5:[['x³ - 2x - 5','x^3 - 2*x - 5',2,3,2,3],['cos(x) - x','cos(x) - x',0,1,.5,1],['eˣ - 3x','exp(x) - 3*x',0,1,.5,1]],
6:[['cos(x) - x en [0, 1]','cos(x) - x',0,1,.5,1],['eˣ - 3x en [0, 1]','exp(x) - 3*x',0,1,.5,1],['x·ln(x) - 1 en [1, 3]','x*log(x) - 1',1,3,2,2.5],['e⁻ˣ - x en [0, 1]','exp(-x) - x',0,1,.5,1]],
7:[['sin(x) - x/10 en [-10, 10]','sin(x) - x/10',-10,10,1,2],['(x-1)²(x+2) en [-3, 3]','(x-1)^2*(x+2)',-3,3,2,2.5],['(x-1)³(x+1) en [-2, 2]','(x-1)^3*(x+1)',-2,2,0,1],['cos(x) en [0, 10]','cos(x)',0,10,1,2]]};
const STEPS=[
[{t:'Normalizar',d:'Se divide entre el coeficiente principal para obtener un polinomio mónico.',f:'P(x) = xⁿ + a₁xⁿ⁻¹ + … + aₙ'},
{t:'Aproximaciones iniciales',d:'Se reparten n complejos distintos sobre una circunferencia de radio dado por la cota de Cauchy.'},
{t:'Iteración de Durand-Kerner',d:'Las n raíces se actualizan simultáneamente:',f:'zᵢ ← zᵢ − P(zᵢ) / ∏_{j≠i} (zᵢ − zⱼ)'},
{t:'Criterio de parada',d:'Se detiene con desplazamiento máximo < 10⁻¹³. En raíces múltiples la convergencia es lineal y se acepta si se estanca por debajo de 10⁻⁶.'},
{t:'Clasificación',d:'Si la parte imaginaria es despreciable la raíz es real; si no, es compleja y aparece con su conjugada.'},
{t:'Pulido en alta precisión',d:'Cada raíz real se refina con Newton y Horner hasta |Δx| < tolerancia:',f:'x ← x − P(x) / P′(x)'},
{t:'Verificación',d:'Se evalúa |P(raíz)|; un residuo grande indica raíz múltiple o mal condicionada.'}],
[{t:'Comprobar el intervalo',d:'Por Bolzano, debe haber cambio de signo en [a, b]:',f:'f(a) · f(b) < 0'},
{t:'Punto medio',d:'Se divide el intervalo a la mitad y se evalúa f:',f:'c = (a + b) / 2'},
{t:'Nuevo subintervalo',d:'Si f(c) tiene el signo de f(a), a ← c; si no, b ← c.'},
{t:'Cota del error',d:'Tras n pasos:',f:'|c − r| ≤ (b − a) / 2ⁿ⁺¹'},
{t:'Parada',d:'Se repite hasta (b − a)/2 < tolerancia o f(c) = 0. Pasos teóricos: n ≥ log₂((b − a)/tol).'}],
[{t:'Aproximación y derivada',d:'Se parte de x₀ cercano a la raíz y se obtiene f′(x) simbólicamente.'},
{t:'Interpretación geométrica',d:'Se traza la tangente en (xₙ, f(xₙ)) y se toma su corte con el eje x.'},
{t:'Recurrencia',d:'',f:'xₙ₊₁ = xₙ − f(xₙ) / f′(xₙ)'},
{t:'Derivada nula',d:'Si f′(xₙ) = 0 la tangente es horizontal y hay que elegir otro x₀.'},
{t:'Parada y orden',d:'Se detiene con |xₙ₊₁ − xₙ| < tolerancia. En raíces simples el orden es p = 2.'}],
[{t:'Dos aproximaciones',d:'Se eligen x₀ y x₁ cercanos a la raíz (no necesitan encerrarla).'},
{t:'Derivada aproximada',d:'f′ se sustituye por la pendiente de la secante:',f:'f′(xₙ) ≈ (f(xₙ) − f(xₙ₋₁)) / (xₙ − xₙ₋₁)'},
{t:'Fórmula iterativa',d:'',f:'xₙ₊₁ = xₙ − f(xₙ)·(xₙ − xₙ₋₁) / (f(xₙ) − f(xₙ₋₁))'},
{t:'Desplazamiento y parada',d:'Se actualiza x₀ ← x₁, x₁ ← x₂ hasta |Δx| < tolerancia. Orden p ≈ 1.618.'}],
[{t:'Ejecución simultánea',d:'Se ejecutan Bisección, Newton-Raphson y Secante con la misma función y parámetros.'},
{t:'Raíz de referencia',d:'Se toma la mejor aproximación (habitualmente Newton) como r.'},
{t:'Error logarítmico',d:'Con eₙ = |xₙ − r|, el valor −log₁₀(eₙ) indica las cifras exactas.'},
{t:'Orden p',d:'Con dₙ = |xₙ₊₁ − xₙ|:',f:'p ≈ ln(dₙ / dₙ₋₁) / ln(dₙ₋₁ / dₙ₋₂)'}],
[{t:'Planteamiento',d:'Las ecuaciones con sin, cos, exp o log no suelen admitir despeje algebraico.'},
{t:'Acotación',d:'Se verifica f(a)·f(b) < 0 para que la raíz permanezca en [lo, hi].'},
{t:'Newton protegido',d:'Si x − f/f′ cae fuera de (lo, hi) se descarta y se usa bisección:',f:'x_nuevo = (lo + hi) / 2'},
{t:'Parada',d:'Termina con |Δx| < tolerancia o ancho del intervalo < tolerancia.'}],
[{t:'Partición',d:'Se divide [a, b] en N subintervalos de longitud h = (b − a)/N y se evalúa f en cada nodo.'},
{t:'Cambios de signo',d:'Donde f(xᵢ)·f(xᵢ₊₁) < 0 se aísla la raíz con el método híbrido y se estima su multiplicidad m.'},
{t:'Raíces múltiples',d:'La multiplicidad es el menor k con f⁽ᵏ⁾(r) ≠ 0. Si m > 1 se refina con Newton modificado (también si f′ cambia de signo con |f| ≈ 0):',f:'xₙ₊₁ = xₙ − m · f(xₙ) / f′(xₙ)'},
{t:'Filtrado',d:'Se eliminan duplicados dentro de la tolerancia y se ordenan de menor a mayor.'}]];

const fracHtml=(n,d)=>`<span class="frac"><span class="num-f">$${n}$</span><span class="den-f">$${d}$</span></span>`;
const dg=()=>Math.min(120,Math.max(10,+$('digits').value||50)),limSteps=()=>+$('detailLimit').value||5;
function fmtNum(v,n=8){if(v.isZero())return'0';let s;if(v.abs().lt('1e-6'))s=v.toExponential(4);else{s=v.toSignificantDigits(Math.min(dg(),n)).toString();if(s.includes('e'))s=v.toFixed(n)}return s.replace(/e\+?(-?\d+)/,'\\times 10^{$1}')}
const sd=(x,n=20)=>x.isZero()?'0':x.toSignificantDigits(Math.min(dg(),n)).toString(),ex=x=>x.isZero()?'0':x.toExponential(3);
const typesetMath=()=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([$('out')]).catch(()=>{})};
const stepBox=(t,it,calc)=>`<div class="card"><h3>${t}</h3><ol class="st">${it.map(s=>calc?`<li>${s}</li>`:`<li><span class="st-title">${s.t}</span>${s.d?`<p class="st-desc">${s.d}</p>`:''}${s.f?`<div class="formula">${s.f}</div>`:''}</li>`).join('')}</ol></div>`;
const table=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
const result=(root,f,extra)=>`<div class="res main"><div class="k">Raíz aproximada</div><div class="v">${root.toString()}</div><div class="k">Residuo f(x)</div><div>${ex(f(root))}</div>${extra?`<div class="k">Detalle</div><div>${extra}</div>`:''}</div>`;

let tab=2,lastExport={headers:[],rows:[],summary:''};
const EMPTY='<div class="empty"><strong>Tu espacio de resultados está listo</strong><br>Ajusta los datos y pulsa «Calcular».</div>';
const themeBtn=$('theme');
function setTheme(m){document.documentElement.dataset.theme=m;themeBtn.textContent=m==='dark'?'☀ Tema claro':'☾ Tema oscuro';if(window._lp)drawPlot(...window._lp)}
let saved=null;try{saved=localStorage.getItem('metodos-theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
themeBtn.onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(n);try{localStorage.setItem('metodos-theme',n)}catch(e){}};

function updatePolyPreview(){
 const cs=$('poly').value.trim().split(/[\s,;]+/).map(Number);
 if(cs.some(v=>!Number.isFinite(v))){$('polyPrev').innerHTML='<span class="err">Coeficientes inválidos</span>';return}
 while(cs.length>1&&cs[0]===0)cs.shift();const deg=cs.length-1,sup=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join(''),p=[];
 cs.forEach((c,i)=>{const e=deg-i;if(c===0&&deg>0)return;const ab=Math.abs(c);p.push(`${c<0?' - ':(p.length?' + ':'')}${ab===1&&e>0?'':ab}${e===0?'':e===1?'x':'x'+sup(e)}`)});
 $('polyPrev').innerHTML=`P(x) = <span>${p.join('')||'0'}</span> (grado ${deg})`}
$('poly').oninput=updatePolyPreview;updatePolyPreview();

$('pre').onchange=()=>{const i=+$('pre').value;if(i<0)return;const p=PRESETS[tab][i];
 if(tab===1){$('poly').value=p[1];updatePolyPreview();return}
 $('f').value=p[1];$('a').value=p[2];$('b').value=p[3];$('x0').value=p[4];$('x1').value=p[5]};
$('tabs').innerHTML=NAMES.map((n,i)=>`<button data-t="${i+1}"><span>0${i+1}</span>${n}</button>`).join('');
function show(){
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.t===tab));
 document.querySelectorAll('[data-for]').forEach(d=>d.classList.toggle('hide',!d.dataset.for.split(' ').includes(''+tab)));
 $('info').textContent=INFO[tab-1];$('ttl').textContent=NAMES[tab-1];$('num').textContent='0'+tab;
 $('out').innerHTML=EMPTY;$('status').textContent='Esperando cálculo';['btnCopy','btnCsv','btnTxt'].forEach(i=>$(i).classList.add('hide'));window._lp=null;
 $('pre').innerHTML='<option value="-1">Selecciona un ejemplo...</option>'+PRESETS[tab].map((p,i)=>`<option value="${i}">${p[0]}</option>`).join('')}
$('tabs').onclick=e=>{const b=e.target.closest('button[data-t]');if(b){tab=+b.dataset.t;show()}};show();

const num=id=>M.evaluate($(id).value.trim());
const fx=s=>{const c=M.compile(s);return x=>{const v=c.evaluate({x});if(!v||typeof v.isFinite!=='function'||!v.isFinite())throw new Error('f(x) no es finita en x = '+x.toString());return v}};
const dfx=s=>fx(M.derivative(s,'x').toString());

  const fv=xs.map(x=>f(x)),ivs=[],roots=[],add=(x,t,m=1)=>{if(!roots.some(r=>r[0].minus(x).abs().lt(1e-7)))roots.push([x,t,m])};
  const maxF=fv.reduce((m,v)=>v.abs().gt(m)?v.abs():m,D(1e-30));
  for(let i=0;i<N;i++){
   if(fv[i].isZero())add(xs[i],'simple (exacta)',1);
   else if(fv[i].times(fv[i+1]).isNeg()){
    ivs.push([ivs.length+1,sd(xs[i],12),sd(xs[i+1],12),ex(fv[i]),ex(fv[i+1])]);
    let c=hybrid(f,df,xs[i],xs[i+1],tol,max);const m=estimateMultiplicity(s,c,maxF);
    if(m>1)c=newtonMultiple(f,df,c,m,tol,max);
    add(c,m>1?'múltiple (cambia de signo, m impar)':'simple (cambio de signo)',m)}}
  if(fv[N].isZero())add(xs[N],'simple (exacta)',1);
  const dv=xs.map(x=>df(x)),tiny=D(1e-5).times(maxF);
  for(let i=0;i<N;i++)if(dv[i].times(dv[i+1]).isNeg()){try{
   let c=hybrid(df,x=>{const e=D(10).pow(-Math.floor(digits/3));return df(x.plus(e)).minus(df(x.minus(e))).div(e.times(2))},xs[i],xs[i+1],tol.times(1e6).lt(1)?tol.times(1e6):D(1e-12),max);
   if(f(c).abs().lt(tiny)&&!roots.some(r=>r[0].minus(c).abs().lt(1e-5))){const m=estimateMultiplicity(s,c,maxF);c=newtonMultiple(f,df,c,m,tol,max);add(c,'múltiple (tangente al eje)',m)}}catch(e){}}
  roots.sort((p,q)=>p[0].comparedTo(q[0]));
  const hd=['#','raíz','multiplicidad m','|f(raíz)|','tipo'],rows=roots.map((r,i)=>[i+1,sd(r[0],Math.min(digits,40)),r[2],ex(f(r[0])),r[1]]);
  setExportData(hd,rows,`f(x) = ${s} en [${sd(a,8)}, ${sd(b,8)}]`);
  h=warn+`<div class="res"><b>${roots.length}</b> raíz(ces) detectadas en [${sd(a,8)}, ${sd(b,8)}]</div><div class="card">${table(hd,rows)}</div>`+plotCard(false);
  dt=ivs.length?`<div class="card"><h3>Cálculo detallado: ${ivs.length} subintervalo(s) con cambio de signo</h3>${table(['#','x izq.','x der.','f(izq.)','f(der.)'],ivs.slice(0,60))}</div>`:'';
  plotArgs=[fN,Number(a),Number(b),roots.map(r=>Number(r[0])),[]];
 }
 let dr=dt;
 if(dt&&dt.includes('math-iter-block')){
  let init='';
  if(tab===2){const av=num('a'),bv=num('b'),F=fx($('f').value);init=`$f(${fmtNum(av,6)}) = ${fmtNum(F(av),8)}; \\qquad f(${fmtNum(bv,6)}) = ${fmtNum(F(bv),8)}$`}
  else if(tab===3){const x0=num('x0');init=`$f(${fmtNum(x0,6)}) = ${fmtNum(fx($('f').value)(x0),8)}$`}
  const blocks=dt.replace(/^<div class="card"><h3>.*?<\/h3><ol class="st"><li>/,'').replace(/<\/li><\/ol><\/div>$/,'').split('</li><li>');
  dr=`<div class="card"><h3>Desarrollo matemático paso a paso</h3><div class="math-sheet"><div class="math-sheet-title">Solución</div>${init?`<div class="math-init">${init}</div>`:''}${blocks.join('')}</div></div>`}
 out.innerHTML=h+stepBox('Procedimiento del método paso a paso',STEPS[tab-1])+dr;typesetMath();$('status').textContent='Cálculo completado';
 if(plotArgs)requestAnimationFrame(()=>drawPlot(...plotArgs));
 }catch(e){out.innerHTML=`<div class="card err">Error: ${e.message}</div>`;$('status').textContent='Error';['btnCopy','btnCsv','btnTxt'].forEach(i=>$(i).classList.add('hide'))}}
$('go').onclick=run;addEventListener('resize',()=>{if(window._lp)drawPlot(...window._lp)});
</script></body></html>
